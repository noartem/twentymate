# CI/CD: build, format check, and installer for TwentyMate.
#
# Steps are driven through Taskfile.yml (see AGENTS.md) so local runs (`task
# check`, `task installer`) and CI stay in sync.
#
# - On every push/PR: restore → lint (dotnet format --verify-no-changes) → build (-warnaserror).
# - The installer (task installer → Installer\build-installer.ps1) is always
#   built afterward and uploaded as a build artifact — it can be downloaded
#   and checked from any run, not just a release run.
# - When a tag like vX.Y.Z is pushed, a GitHub Release is additionally
#   published with the installer attached; the installer's version is taken
#   from the tag.
#
# There are no tests yet (see TODO.md) — this pipeline doesn't run `task test`.
# `task lint` (dotnet format --verify-no-changes) temporarily serves as the lint gate.

name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and checks
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Setup Task
        uses: arduino/setup-task@v2
        with:
          version: "3.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore
        run: task restore

      # There's no .sln project — we work with the .csproj directly (see README.md).
      # The repo is currently format-clean, so the gate is enabled right away.
      - name: Format check (dotnet format)
        run: task lint

      # -warnaserror catches new warnings but doesn't touch anything already
      # suppressed via <NoWarn> in the csproj (e.g. WFAC010) — NoWarn always
      # takes priority over warnaserror.
      - name: Build (Release, warnings as errors)
        run: task build -- -c Release --no-restore -warnaserror

  installer:
    name: Build installer
    needs: build
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Setup Task
        uses: arduino/setup-task@v2
        with:
          version: "3.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # Chocolatey comes preinstalled on windows-latest and works without
      # administrator rights or interactive prompts (unlike winget on hosted
      # runners). build-installer.ps1 finds ISCC.exe itself at the standard
      # Program Files (x86)\Inno Setup 6 path — no need to extend PATH in
      # this step.
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      # If the build was triggered by a vX.Y.Z tag, the installer version is
      # taken from the tag (guarantees the release and the exe's internal
      # version match); otherwise it falls back to the default version from
      # <Version> in TwentyMate.csproj.
      - name: Build installer
        shell: pwsh
        run: |
          $ver = if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $env:GITHUB_REF -replace '^refs/tags/v', ''
          } else {
            $null
          }
          if ($ver) {
            Write-Host "Version from tag: $ver"
            & task installer -- -Version $ver
          } else {
            & task installer
          }

      - name: Publish artifact
        uses: actions/upload-artifact@v4
        with:
          name: TwentyMate-Setup
          path: dist/TwentyMate-Setup-*.exe
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: installer
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download installer
        uses: actions/download-artifact@v4
        with:
          name: TwentyMate-Setup
          path: dist

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/TwentyMate-Setup-*.exe
          generate_release_notes: true
